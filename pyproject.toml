[project]
name = "sumac-home"
version = "0.1.1"
description = "Home grocery inventory app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sealedlog>=0.1.0",
    "pydantic>=2",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
sumac = "sumac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sumac"]

[dependency-groups]
dev = [
    "pynacl>=1.5",
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
