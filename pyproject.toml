[project]
name = "sumac-home"
version = "0.1.4"
description = "Home grocery inventory app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sealedlog>=0.1.0",
    "pydantic>=2",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
sumac = "sumac.cli:main"

[project.optional-dependencies]
ask = [
    "mistralrs>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sumac"]

[tool.hatch.build.targets.sdist]
exclude = ["/evals"]

[dependency-groups]
ask = [
    "mistralrs>=0.9.2",
]
ask-cuda = [                          # local CUDA build for this machine's GPU — see scripts/build-mistralrs-cuda.sh
    "mistralrs==0.9.2",
]
dev = [
    "pynacl>=1.5",
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8",
    "hypothesis>=6",
]
evals = [
    "pytest>=8",
    "pytest-timeout>=2",
]

[tool.uv]
default-groups = ["dev"]
conflicts = [
    [
        { group = "ask" },
        { group = "ask-cuda" },
    ],
]

[tool.uv.sources]
mistralrs = [
    { path = "vendor/wheels/mistralrs-0.9.2-cp310-abi3-manylinux_2_39_x86_64.whl", group = "ask-cuda" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: eval that loads a real local model — see evals/README.md"]
